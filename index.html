<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Life Saving</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#0f172a;
    color:white;
    padding:20px;
}


.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}


.logo{
    font-size:28px;
    font-weight:700;
    color:#FFD700;
}


.profile{
    width:45px;
    height:45px;
    border-radius:50%;
    background:#1e293b;
    display:flex;
    justify-content:center;
    align-items:center;
}


.card{
    background:#1e293b;
    padding:20px;
    border-radius:20px;
    margin-bottom:20px;
    box-shadow:0 5px 15px rgba(0,0,0,.3);
}


.balance{
    font-size:40px;
    font-weight:bold;
    color:#FFD700;
}


.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
    margin-top:20px;
}


.box{
    background:#334155;
    padding:15px;
    border-radius:15px;
    text-align:center;
}


.box h3{
    font-size:14px;
}


.box p{
    font-size:22px;
    font-weight:bold;
    color:#FFD700;
}


.progress{
    height:14px;
    background:#475569;
    border-radius:20px;
    overflow:hidden;
    margin-top:20px;
}


.bar{
    height:100%;
    width:50%;
    background:#FFD700;
}


input{
    width:100%;
    padding:15px;
    margin-top:10px;
    border:none;
    border-radius:12px;
    background:#334155;
    color:white;
    font-size:16px;
}


button{
    width:100%;
    padding:15px;
    margin-top:10px;
    border:none;
    border-radius:12px;
    background:#FFD700;
    font-weight:bold;
}


.history-item{
    background:#334155;
    padding:15px;
    border-radius:12px;
    margin-top:10px;
}


</style>

</head>


<body>


<div class="header">

<div class="logo">
For Life Saving
</div>

<div class="profile">
👤
</div>

</div>



<div class="card">

<h3>বর্তমান সঞ্চয়</h3>

<div class="balance">
৳ 0
</div>


<div class="row">

<div class="box">
<h3>মোট জমা</h3>
<p>৳ 0</p>
</div>


<div class="box">
<h3>এই মাসে</h3>
<p>৳ 0</p>
</div>

</div>


<div class="progress">
<div class="bar"></div>
</div>


</div>




<div class="card">

<h3>নতুন সঞ্চয় যোগ করুন</h3>

<input type="number" placeholder="টাকার পরিমাণ">

<button>
জমা করুন
</button>

</div>




<div class="card">

<h3>সঞ্চয়ের ইতিহাস</h3>

<div class="history-item">
এখনো কোনো সঞ্চয় নেই
</div>

</div>


</body>
</html>
