<!DOCTYPE html>
<html>
<head>
<title>For Life Saving</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#090909;
color:white;
}

.header{
text-align:center;
padding:30px;
background:linear-gradient(135deg,#111,#333);
}

.header h1{
color:#ffd700;
font-size:38px;
}

.card{
background:#181818;
margin:20px;
padding:20px;
border-radius:25px;
box-shadow:0 0 20px #222;
}

.number{
font-size:32px;
color:#ffd700;
font-weight:bold;
}

input{
width:85%;
padding:14px;
border-radius:15px;
border:none;
margin:8px;
}

button{
padding:14px 22px;
border:none;
border-radius:30px;
background:#ffd700;
font-weight:bold;
margin:5px;
}

.progress{
background:#333;
height:20px;
border-radius:20px;
overflow:hidden;
}

.bar{
height:20px;
background:#ffd700;
width:0%;
}

.history{
background:#222;
padding:12px;
border-radius:15px;
margin-top:10px;
}

</style>
</head>

<body>

<div class="header">
<h1>For Life Saving</h1>
<p>স্মার্ট সঞ্চয়, সুন্দর ভবিষ্যৎ</p>
</div>


<div class="card">
<h2>💰 বর্তমান সঞ্চয়</h2>
<div class="number">৳ <span id="total">0</span></div>
</div>


<div class="card">
<h2>🎯 সঞ্চয়ের লক্ষ্য</h2>

<input id="target" type="number" placeholder="লক্ষ্য টাকা">

<br>

<button onclick="setTarget()">লক্ষ্য সেট করুন</button>

<p id="goalText">লক্ষ্য সেট করা হয়নি</p>

<div class="progress">
<div class="bar" id="bar"></div>
</div>

<p id="percent">0%</p>

</div>


<div class="card">
<h2>➕ লেনদেন</h2>

<input id="amount" type="number" placeholder="টাকার পরিমাণ">

<br>

<button onclick="addMoney()">💰 জমা</button>

<button onclick="expense()">💸 খরচ</button>

</div>


<div class="card">
<h2>📋 ইতিহাস</h2>

<div id="history">
কোনো লেনদেন নেই
</div>

</div>


<script>

let total=Number(localStorage.getItem("total")||0);
let target=Number(localStorage.getItem("target")||0);

let history=JSON.parse(localStorage.getItem("history")||"[]");


function update(){

document.getElementById("total").innerHTML=total;

let p=target ? Math.floor((total/target)*100):0;

if(p>100)p=100;

document.getElementById("bar").style.width=p+"%";
document.getElementById("percent").innerHTML=p+"% পূর্ণ";

document.getElementById("goalText").innerHTML=
target ? "লক্ষ্য: ৳ "+target : "লক্ষ্য সেট করা হয়নি";


let h="";

history.forEach(i=>{
h+="<div class='history'>"+
i.type+" : ৳"+i.amount+
"<br>"+i.date+
"</div>";
});

document.getElementById("history").innerHTML=h||"কোনো লেনদেন নেই";

}


function addMoney(){

let a=Number(document.getElementById("amount").value);

if(a){

total+=a;

history.unshift({
type:"জমা",
amount:a,
date:new Date().toLocaleString()
});

save();

}

}


function expense(){

let a=Number(document.getElementById("amount").value);

if(a){

total-=a;

history.unshift({
type:"খরচ",
amount:a,
date:new Date().toLocaleString()
});

save();

}

}


function setTarget(){

target=Number(document.getElementById("target").value);

localStorage.setItem("target",target);

update();

}


function save(){

localStorage.setItem("total",total);
localStorage.setItem("history",JSON.stringify(history));

document.getElementById("amount").value="";

update();

}


update();

</script>
