<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Life Saving</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#0f172a,#111827,#020617);
color:#fff;
padding:20px;
}

.header{
text-align:center;
margin-bottom:25px;
}

.logo{
font-size:38px;
font-weight:bold;
color:#FFD700;
}

.subtitle{
margin-top:8px;
color:#cbd5e1;
font-size:15px;
}

.card{
background:rgba(255,255,255,.08);
backdrop-filter:blur(15px);
border-radius:20px;
padding:20px;
margin-bottom:18px;
box-shadow:0 0 20px rgba(0,0,0,.3);
}

.balance{
font-size:38px;
font-weight:bold;
color:#FFD700;
margin-top:10px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
margin-top:15px;
}

.small-card{
background:rgba(255,255,255,.06);
padding:18px;
border-radius:18px;
text-align:center;
}

.small-card h3{
font-size:14px;
color:#ddd;
}

.small-card p{
margin-top:8px;
font-size:22px;
font-weight:bold;
color:#FFD700;
}

.progress{
height:14px;
background:#1e293b;
border-radius:20px;
overflow:hidden;
margin-top:15px;
}

.bar{
height:100%;
width:0%;
background:linear-gradient(90deg,#FFD700,#ff9800);
transition:.5s;
}

input{
width:100%;
padding:14px;
border:none;
border-radius:15px;
margin-top:12px;
background:#1e293b;
color:#fff;
font-size:16px;
}

button{
width:100%;
padding:14px;
margin-top:12px;
border:none;
border-radius:15px;
background:#FFD700;
color:#000;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

button:hover{
opacity:.9;
}

.history-item{
background:#1e293b;
padding:15px;
border-radius:15px;
margin-top:10px;
}

.footer{
text-align:center;
margin-top:25px;
color:#94a3b8;
font-size:13px;
}

</style>
</head>

<body>

<div class="header">
<div class="logo">💰 For Life Saving</div>
<div class="subtitle">
স্মার্ট সঞ্চয় • সুন্দর ভবিষ্যৎ
</div>
</div>

<div class="card">

<h2>বর্তমান সঞ্চয়</h2>

<div class="balance">
৳ <span id="total">0</span>
</div>

<div class="grid">

<div class="small-card">
<h3>আজ</h3>
<p id="today">0</p>
</div>

<div class="small-card">
<h3>এই মাস</h3>
<p id="month">0</p>
</div>

</div>

<h3 style="margin-top:20px;">
লক্ষ্য পূরণ
</h3>

<div class="progress">
<div class="bar" id="bar"></div>
</div>

<p id="percent"
style="margin-top:10px;">
0%
</p>

</div>
<div class="card">
<h2>🎯 সঞ্চয়ের লক্ষ্য</h2>

<input id="target" type="number" placeholder="লক্ষ্য টাকা">

<button onclick="setTarget()">লক্ষ্য সেট করুন</button>

<p id="goalText">লক্ষ্য সেট করা হয়নি</p>
</div>

<div class="card">
<h2>💸 লেনদেন</h2>

<input id="amount" type="number" placeholder="টাকার পরিমাণ">

<button onclick="addMoney()">➕ টাকা জমা</button>

<button onclick="expense()">➖ টাকা খরচ</button>
</div>

<div class="card">
<h2>📋 সাম্প্রতিক লেনদেন</h2>

<div id="history">
কোনো লেনদেন নেই
</div>

</div>

<div class="footer">
For Life Saving © 2026
</div>

<script>

let total=Number(localStorage.getItem("total")||0);
let target=Number(localStorage.getItem("target")||0);

let history=JSON.parse(localStorage.getItem("history")||"[]");

function update(){

document.getElementById("total").innerHTML=total;

let p=target?Math.min(Math.floor((total/target)*100),100):0;

document.getElementById("bar").style.width=p+"%";

document.getElementById("percent").innerHTML=p+"%";

document.getElementById("goalText").innerHTML=
target?"লক্ষ্য: ৳ "+target:"লক্ষ্য সেট করা হয়নি";

let h="";

history.forEach(i=>{

h+=`
<div class="history-item">
<b>${i.type}</b><br>
৳ ${i.amount}<br>
<small>${i.date}</small>
</div>`;

});

document.getElementById("history").innerHTML=
h||"কোনো লেনদেন নেই";

}

function save(){

localStorage.setItem("total",total);
localStorage.setItem("target",target);
localStorage.setItem("history",JSON.stringify(history));

document.getElementById("amount").value="";

update();

}

function addMoney(){

let a=Number(document.getElementById("amount").value);

if(!a)return;

total+=a;

history.unshift({
type:"জমা",
amount:a,
date:new Date().toLocaleString()
});

save();

}

function expense(){

let a=Number(document.getElementById("amount").value);

if(!a)return;

total-=a;

history.unshift({
type:"খরচ",
amount:a,
date:new Date().toLocaleString()
});

save();

}

function setTarget(){

target=Number(document.getElementById("target").value);

save();

}

update();

</script>

</body>
</html>
