<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Life Saving</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#0f172a;
color:#fff;
padding:20px;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.logo{
font-size:28px;
font-weight:700;
color:#FFD700;
}

.profile{
width:45px;
height:45px;
border-radius:50%;
background:#1e293b;
display:flex;
justify-content:center;
align-items:center;
font-size:20px;
}

.card{
background:#1e293b;
padding:20px;
border-radius:20px;
margin-bottom:20px;
box-shadow:0 5px 15px rgba(0,0,0,.3);
}

.balance{
font-size:40px;
font-weight:bold;
color:#FFD700;
margin-top:10px;
}

.row{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
margin-top:20px;
}

.box{
background:#334155;
padding:15px;
border-radius:15px;
text-align:center;
}

.box h3{
font-size:14px;
margin-bottom:10px;
}

.box p{
font-size:22px;
font-weight:bold;
color:#FFD700;
}

.progress{
height:14px;
background:#475569;
border-radius:20px;
overflow:hidden;
margin-top:20px;
}

.bar{
height:100%;
width:0%;
background:#FFD700;
transition:.4s;
}

input{
width:100%;
padding:15px;
border:none;
border-radius:12px;
margin-top:10px;
background:#334155;
color:white;
font-size:16px;
}

button{
width:100%;
padding:15px;
margin-top:10px;
border:none;
border-radius:12px;
background:#FFD700;
font-weight:bold;
cursor:pointer;
}

.history-item{
background:#334155;
padding:15px;
border-radius:12px;
margin-top:10px;
}

</style>
</head>

<body>

<div class="header">
<div class="logo">💰 For Life Saving</div>
<div class="profile">👤</div>
</div>

<div class="card">
<h2>বর্তমান সঞ্চয়</h2>

<div class="balance">
৳ <span id="total">0</span>
</div>

<div class="row">

<div class="box">
<h3>আজ</h3>
<p id="today">0</p>
</div>

<div class="box">
<h3>এই মাস</h3>
<p id="month">0</p>
</div>

</div>

<div class="progress">
<div class="bar" id="bar"></div>
</div>

<p id="percent">0%</p>

</div>
<div class="card">

<h2>🎯 সঞ্চয়ের লক্ষ্য</h2>

<input
id="target"
type="number"
placeholder="লক্ষ্য টাকা">

<button onclick="setTarget()">
লক্ষ্য সেট করুন
</button>

<p id="goalText">
লক্ষ্য সেট করা হয়নি
</p>

</div>

<div class="card">

<h2>💸 লেনদেন</h2>

<input
id="amount"
type="number"
placeholder="টাকার পরিমাণ">

<button onclick="addMoney()">
➕ টাকা জমা
</button>

<button onclick="expense()">
➖ টাকা খরচ
</button>

</div>

<div class="card">

<h2>📋 সাম্প্রতিক লেনদেন</h2>

<div id="history">

কোনো লেনদেন নেই

</div>

</div>

<div class="card">

<button onclick="logout()">
🚪 Logout
</button>

</div>

<footer
style="
text-align:center;
margin-top:30px;
color:#94a3b8;
font-size:13px;
">

For Life Saving © 2026

</footer>

<script>

let total=0;
let target=0;
let history=[];

function update(){

document.getElementById("total").innerHTML=total;

let p=target?Math.floor((total/target)*100):0;

if(p>100)p=100;

document.getElementById("bar").style.width=p+"%";

document.getElementById("percent").innerHTML=p+"%";

document.getElementById("goalText").innerHTML=
target?
"লক্ষ্য: ৳ "+target:
"লক্ষ্য সেট করা হয়নি";

let h="";

history.forEach(item=>{

h+=`
<div class="history-item">

<b>${item.type}</b>

<br>

৳ ${item.amount}

<br>

<small>${item.date}</small>

</div>
`;

});

document.getElementById("history").innerHTML=
h||"কোনো লেনদেন নেই";

}

function setTarget(){

target=Number(
document.getElementById("target").value
);

update();

}
  function addMoney(){

let amount=Number(
document.getElementById("amount").value
);

if(!amount)return;

total+=amount;

history.unshift({
type:"জমা",
amount:amount,
date:new Date().toLocaleString()
});

document.getElementById("amount").value="";

update();

}

function expense(){

let amount=Number(
document.getElementById("amount").value
);

if(!amount)return;

if(amount>total){

alert("পর্যাপ্ত টাকা নেই");

return;

}

total-=amount;

history.unshift({
type:"খরচ",
amount:amount,
date:new Date().toLocaleString()
});

document.getElementById("amount").value="";

update();

}

function logout(){

alert("Logout সফল হয়েছে");

// পরে এখানে Firebase Logout যোগ করা হবে

}

update();

</script>

</body>
</html>
