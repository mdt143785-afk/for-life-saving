<!DOCTYPE html>
<html>
<head>
<title>For Life Saving</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#09090b;
 color:white;
}

.header{
 text-align:center;
 padding:35px 15px;
 background:linear-gradient(135deg,#111827,#000);
}

.header h1{
 color:#ffd700;
 font-size:38px;
}

.card{
 background:#18181b;
 margin:20px;
 padding:25px;
 border-radius:25px;
 box-shadow:0 0 25px #000;
 text-align:center;
}

.balance{
 font-size:40px;
 color:#ffd700;
 font-weight:bold;
}

input{
 width:80%;
 padding:15px;
 border-radius:15px;
 border:none;
 margin:10px;
 font-size:18px;
}

button{
 padding:15px 25px;
 margin:8px;
 border:none;
 border-radius:30px;
 font-size:17px;
 font-weight:bold;
 cursor:pointer;
 background:linear-gradient(45deg,#ffd700,#ff9900);
 color:#111;
 box-shadow:0 0 15px #ffd700;
}

button:hover{
 transform:scale(1.05);
}

.history{
 text-align:left;
 color:#ddd;
}

</style>
</head>

<body>

<div class="header">
<h1>For Life Saving</h1>
<p>স্মার্টভাবে সঞ্চয় করুন, ভবিষ্যৎ গড়ুন</p>
</div>


<div class="card">
<h2>মোট সঞ্চয়</h2>
<div class="balance">
৳ <span id="total">0</span>
</div>
</div>


<div class="card">

<h2>লেনদেন যোগ করুন</h2>

<input id="amount" type="number" placeholder="টাকার পরিমাণ">

<br>

<button onclick="addMoney()">💰 টাকা জমা</button>

<button onclick="removeMoney()">💸 খরচ</button>

</div>


<div class="card">
<h2>ইতিহাস</h2>
<div class="history" id="history">
কোনো লেনদেন নেই
</div>
</div>


<script>

let total = localStorage.getItem("saving") || 0;

document.getElementById("total").innerHTML = total;


function addMoney(){

let amount=document.getElementById("amount").value;

if(amount){

total = Number(total)+Number(amount);

save("জমা +"+amount);

}

}


function removeMoney(){

let amount=document.getElementById("amount").value;

if(amount){

total = Number(total)-Number(amount);

save("খরচ -"+amount);

}

}


function save(text){

localStorage.setItem("saving",total);

document.getElementById("total").innerHTML=total;

let old=document.getElementById("history").innerHTML;

document.getElementById("history").innerHTML=
text+" টাকা<br>"+old;

document.getElementById("amount").value="";

}

</script>

</body>
</html>
