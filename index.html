<!DOCTYPE html>
<html>
<head>
<title>For Life Saving</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#080808;
 color:white;
}

.header{
 text-align:center;
 padding:30px;
 background:linear-gradient(135deg,#111,#333);
}

.header h1{
 color:#ffd700;
 font-size:38px;
}

.card{
 background:#171717;
 margin:20px;
 padding:25px;
 border-radius:25px;
 text-align:center;
 box-shadow:0 0 20px #222;
}

.number{
 font-size:35px;
 color:#ffd700;
 font-weight:bold;
}

input{
 width:80%;
 padding:14px;
 border-radius:15px;
 border:none;
 margin:8px;
 font-size:16px;
}

button{
 padding:14px 25px;
 margin:8px;
 border:none;
 border-radius:30px;
 background:#ffd700;
 color:#111;
 font-weight:bold;
 font-size:16px;
 box-shadow:0 0 15px #ffd700;
}

.progress{
 background:#333;
 border-radius:20px;
 overflow:hidden;
 height:20px;
}

.bar{
 height:20px;
 background:#ffd700;
 width:0%;
}

</style>
</head>

<body>

<div class="header">
<h1>For Life Saving</h1>
<p>স্মার্ট সঞ্চয়, সুন্দর ভবিষ্যৎ</p>
</div>

<div class="card">
<h2>বর্তমান সঞ্চয়</h2>
<div class="number">৳ <span id="total">0</span></div>
</div>

<div class="card">
<h2>🎯 সঞ্চয়ের লক্ষ্য</h2>

<input id="target" type="number" placeholder="লক্ষ্য টাকা">

<br>

<button onclick="setTarget()">লক্ষ্য সেট করুন</button>

<p>অগ্রগতি</p>

<div class="progress">
<div class="bar" id="bar"></div>
</div>

<p id="percent">0%</p>

</div>


<div class="card">
<h2>টাকা যোগ করুন</h2>

<input id="amount" type="number" placeholder="টাকার পরিমাণ">

<br>

<button onclick="add()">💰 জমা</button>

<button onclick="remove()">💸 খরচ</button>

</div>


<script>

let total=Number(localStorage.getItem("saving")||0);
let target=Number(localStorage.getItem("target")||0);

update();


function add(){
let a=Number(document.getElementById("amount").value);
total+=a;
localStorage.setItem("saving",total);
update();
}


function remove(){
let a=Number(document.getElementById("amount").value);
total-=a;
localStorage.setItem("saving",total);
update();
}


function setTarget(){
target=Number(document.getElementById("target").value);
localStorage.setItem("target",target);
update();
}


function update(){

document.getElementById("total").innerHTML=total;

let p= target ? Math.floor((total/target)*100):0;

if(p>100)p=100;

document.getElementById("bar").style.width=p+"%";
document.getElementById("percent").innerHTML=p+"% সম্পন্ন";

}

</script>

</body>
</html>
